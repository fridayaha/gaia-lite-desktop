[project]
name = "unionagents"
version = "0.9.2"
description = "UnionAgents - Enterprise AI Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4.1.0",
    "pydantic[email]>=2.0",
    "pydantic-settings",
    "pypinyin>=0.50",
    "httpx",
    "sse-starlette",
    "python-multipart",
    "aiosqlite>=0.22.1",
    "kubernetes>=30.0.0",
    "minio>=7.2.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "langfuse>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "ipython",
]
integration = [
    "testcontainers[minio]>=4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 各服务测试 `from pkg.common...` 与 `from app...` 都依赖 repo root 在 sys.path
# （服务自身 app 包经其 tests/__init__.py 机制注入）。pythonpath 相对 rootdir=repo root。
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
