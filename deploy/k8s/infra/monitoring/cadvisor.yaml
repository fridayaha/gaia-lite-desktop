apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: monitoring
  labels:
    app: cadvisor
spec:
  selector:
    matchLabels: { app: cadvisor }
  template:
    metadata:
      labels: { app: cadvisor }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.51.0
          args:
            - --housekeeping_interval=10s
            - --docker_only=false
            - --storage_duration=1m0s
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: containerd
              mountPath: /var/lib/containerd
              readOnly: true
            - name: run-containerd
              mountPath: /run/containerd
              readOnly: true
            - name: dev-disk
              mountPath: /dev/disk
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: rootfs
          hostPath: { path: / }
        - name: sys
          hostPath: { path: /sys }
        - name: containerd
          hostPath: { path: /var/lib/containerd }
        - name: run-containerd
          hostPath: { path: /run/containerd }
        - name: dev-disk
          hostPath: { path: /dev/disk }
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: monitoring
  labels:
    app: cadvisor
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector: { app: cadvisor }
