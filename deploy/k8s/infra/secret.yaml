apiVersion: v1
kind: Secret
metadata:
  name: unionagents-secret
type: Opaque
stringData:
  # 本地 k3s dev 占位——生产由 deploy/ci/.env.local 注入（deploy.sh envsubst）。
  # 仓库内只放 ${ENV_VAR} 占位符，不含任何真实凭据。
  pg-user: "${PG_USER:-unionagents}"
  pg-password: "${PG_PASSWORD}"
  jwt-secret: "${JWT_SECRET}"
  database-url: "postgresql+asyncpg://${PG_USER:-unionagents}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE:-unionagents}"
  minio-user: "${MINIO_USER:-unionagents}"
  minio-password: "${MINIO_PASSWORD}"
  minio-endpoint: "${MINIO_ENDPOINT:-http://minio:9000}"
  api-server-key: "${API_SERVER_KEY}"
  # OpenAI 兼容 API Key HMAC 签名密钥（prod 必填 ≥ 32 字符随机串，设后不可改，须冷备）
  api-key-hmac-secret: "${API_KEY_HMAC_SECRET}"
  # Hub 能力中心（同步 sqlalchemy + psycopg driver，与 manager asyncpg 分离）
  # dev 共享 unionagents DB（hub_* 表前缀隔离）；生产应独立 hub DB
  hub-database-url: "postgresql+psycopg://${PG_USER:-unionagents}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE:-unionagents}"
  # LiteLLM 模型网关（prod 必填，设后不可改，须冷备）
  litellm-master-key: "${LITELLM_MASTER_KEY}"
  litellm-salt-key: "${LITELLM_SALT_KEY}"
  litellm-database-url: "postgresql://${PG_USER:-unionagents}:${PG_PASSWORD}@postgres:5432/${LITELLM_DATABASE:-litellm}"
  # Hermes Langfuse 插件凭据（双写关联用，与 Gateway 同实例）
  # dev 占位值，生产由 deploy/ci/.env.local 注入；未注入时 Hermes 插件 fail open
  hermes-langfuse-public-key: "${HERMES_LANGFUSE_PUBLIC_KEY}"
  hermes-langfuse-secret-key: "${HERMES_LANGFUSE_SECRET_KEY}"
  hermes-langfuse-base-url: "${HERMES_LANGFUSE_BASE_URL:-http://langfuse.monitoring:3000}"
