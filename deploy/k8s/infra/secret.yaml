apiVersion: v1
kind: Secret
metadata:
  name: unionagents-secret
type: Opaque
stringData:
  pg-user: unionagents
  pg-password: change-me
  jwt-secret: change-me
  database-url: postgresql+asyncpg://unionagents:change-me@postgres:5432/unionagents
  minio-user: unionagents
  minio-password: change-me
  minio-endpoint: http://minio:9000
  api-server-key: change-me
  # OpenAI 兼容 API Key HMAC 签名密钥（local k3s dev 占位，生产替换为 ≥ 32 字符随机串并冷备）
  api-key-hmac-secret: change-me-api-key-hmac-secret-min-32-chars
  # Hub 能力中心（同步 sqlalchemy + psycopg driver，与 manager asyncpg 分离）
  # dev 共享 unionagents DB（hub_* 表前缀隔离）；生产应独立 hub DB
  hub-database-url: postgresql+psycopg://unionagents:change-me@postgres:5432/unionagents
  # LiteLLM 模型网关（本地 k3s 开发占位值，生产请替换并冷备）
  litellm-master-key: sk-ua-litellm-master-change-me
  litellm-salt-key: sk-ua-litellm-salt-change-me
  litellm-database-url: postgresql://unionagents:change-me@postgres:5432/litellm
  # Hermes Langfuse 插件凭据（双写关联用，与 Gateway 同实例）
  # dev 占位值，生产由 deploy/ci/.env.local 注入；未注入时 Hermes 插件 fail open
  hermes-langfuse-public-key: pk-lf-change-me
  hermes-langfuse-secret-key: sk-lf-change-me
  hermes-langfuse-base-url: http://langfuse.monitoring:3000
