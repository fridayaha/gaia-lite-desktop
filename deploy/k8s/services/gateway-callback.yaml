---
# Gateway callback 对外暴露 Service
# callback 路由(/api/gateway/channel/{channel_type}/{agent_id}/callback)在 gateway:8010 上,
# 此 Service 仅做端口映射与 NodePort 暴露,不改变 gateway 内部端口(8010),
# manager UA_GATEWAY_URL=http://gateway:8010 等现有调用不受影响。
# 对外:NodePort 30843 → Service 8443 → gateway pod 8010
apiVersion: v1
kind: Service
metadata:
  name: gateway-callback
  namespace: unionagents
  labels:
    app: gateway
  annotations:
    description: "IM webhook callback 对外暴露;port 8443 -> targetPort 8010, NodePort 30843"
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - name: callback
    port: 8443
    targetPort: 8010
    nodePort: 30843
