  selector: { app: hub }

---
# ── Skill Engine 服务（技能开发/调试引擎，Node.js Fastify :8004）──
# manager 的 skill_engine_proxy 路由 /api/skill-engine/* → http://skill-engine:8004。
# 工作区数据落 PVC；LLM key 运行时从 manager 拉（Phase 5），pod env 不含 LITELLM_API_KEY。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skill-engine-workspaces
  namespace: unionagents
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: __PVC_SC__
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-engine
  namespace: unionagents
  labels:
    app: skill-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-engine
  template:
    metadata:
      labels:
        app: skill-engine
      annotations:
        unionagents/rollUpdate: "${GITEE_COMMIT}"
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: skill-engine
          image: "${REGISTRY}/unionagents/skill-engine:${VERSION}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: unionagents-secret
                  key: skill-engine-database-url
            - name: WORKSPACE_BASE_DIR
              value: /data/workspaces
            - name: LOG_LEVEL
              value: info
            # pi SDK 启动时默认做版本检查/telemetry（联网），无外网会致 createAgentSession 挂起。
            - name: PI_OFFLINE
              value: "1"
            - name: PI_SKIP_VERSION_CHECK
              value: "1"
            - name: PI_TELEMETRY
              value: "0"
            # Phase 5：LLM key 运行时用 UA_INTERNAL_TOKEN 调 manager 内部端点拉取，不落 pod env。
            # UA_INTERNAL_TOKEN 与 manager 共用 unionagents-secret/internal-token（云端由 .env.local 注入，天然对齐）。
            - name: MANAGER_BASE_URL
              value: http://manager:8002
            - name: UA_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: unionagents-secret
                  key: internal-token
            # config_params secret:true 加密存储用（与 manager 共用 unionagents-secret/credential-encryption-key，
            # 云端由 .env.local 的 CREDENTIAL_ENCRYPTION_KEY 经 deploy.sh envsubst 注入，同值）。
            - name: UA_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: unionagents-secret
                  key: credential-encryption-key
            - name: HUB_BASE_URL
              value: http://hub:8003
            - name: SKILL_ENGINE_MODEL
              value: deepseek-v4-flash
            - name: SKILL_ENGINE_PROVIDER
              value: litellm
            # 并发 worker 上限。2Gi 内存实际只够 ~2-3 个忙会话（pi worker + LLM 流 + bash 脚本，
            # 单会话峰值 ~935Mi），降到 5 让并发上限与内存上限对齐，超额干净失败而非 OOM-kill。
            - name: MAX_INSTANCES
              value: "5"
            # REDIS_URL 未配置：消息缓存降级为 PG 直写（生产建议接 redis）
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: workspace-data
              mountPath: /data/workspaces
          readinessProbe:
            httpGet:
              path: /api/skill-engine/workspaces
              port: 8004
              httpHeaders:
                - name: x-actor-id
                  value: healthz
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/skill-engine/workspaces
              port: 8004
              httpHeaders:
                - name: x-actor-id
                  value: healthz
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: workspace-data
          persistentVolumeClaim:
            claimName: skill-engine-workspaces
---
apiVersion: v1
kind: Service
metadata:
  name: skill-engine
  namespace: unionagents
spec:
  ports:
    - port: 8004
      targetPort: 8004
  selector:
    app: skill-engine
