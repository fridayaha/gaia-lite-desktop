apiVersion: v1
kind: Secret
metadata:
  name: unionagents-secret
type: Opaque
stringData:
  # --- PostgreSQL ---
  database-url: "${DB_URL}"

  # --- JWT ---
  jwt-secret: "${JWT_SECRET}"

  # --- Skill 凭证加密 key（Fernet 派生；prod 必填，设后不可改，必须冷备）---
  credential-encryption-key: "${CREDENTIAL_ENCRYPTION_KEY}"

  # --- 智能体 API Key HMAC 签名密钥（OpenAI 兼容 sk- Key；prod 必填 ≥ 32 字符，设后不可改）---
  api-key-hmac-secret: "${API_KEY_HMAC_SECRET}"

  # --- OSS / MinIO 对象存储 ---
  oss-secret-id: "${OSS_ACCESS_KEY}"
  oss-secret-key: "${OSS_SECRET_KEY}"

  # --- 引擎通信密钥 ---
  api-server-key: "${API_SERVER_KEY}"

  # --- gateway↔manager 内部服务令牌（#4：sk- 客户端图片解析用 X-Internal-Token 头）---
  # gateway 与 manager 共用；prod 必填，dev 留空。由 deploy.sh 从 .env.local 的 UA_INTERNAL_TOKEN 注入。
  internal-token: "${UA_INTERNAL_TOKEN}"

  # --- ASR（火山引擎语音转文字；未启用留空，gateway manifest 引用此 key）---
  asr-volc-api-key: "${UA_ASR_VOLC_API_KEY}"

  # --- LiteLLM 模型网关 ---
  # master key：manager 管理 LiteLLM 用（UA_LITELLM_MASTER_KEY 须与此一致）
  litellm-master-key: "${LITELLM_MASTER_KEY}"
  # salt key：LiteLLM 加密上游供应商凭据，设后不可改，必须冷备
  litellm-salt-key: "${LITELLM_SALT_KEY}"
  # litellm 独立 database（同步驱动，由 deploy.sh 拼接）
  litellm-database-url: "${LITELLM_DATABASE_URL}"
  # hub 共用 unionagents database（psycopg 同步驱动，由 deploy.sh 拼接）
  hub-database-url: "${HUB_DATABASE_URL}"
  # skill-engine 独立 database（同步驱动，由 deploy.sh 拼接；DB 由 deploy.sh 幂等创建）
  skill-engine-database-url: "${SKILL_ENGINE_DATABASE_URL}"

  # --- 语音 ASR（豆包 OpenSpeech X-Api-Key）---
  asr-volc-api-key: "${ASR_VOLC_API_KEY}"

  # --- APK 发布签名（APP 管理：base APK patch 后用此 keystore 重签）---
  # release.keystore 的 base64 编码（manager 容器 initContainer 解码到 /keystore/release.keystore）
  release-keystore-base64: "${RELEASE_KEYSTORE_BASE64}"
  # keystore.properties 中的字段（alias/store/key passwords）
  keystore-alias: "${KEYSTORE_ALIAS}"
  keystore-password: "${KEYSTORE_PASSWORD}"
  key-password: "${KEY_PASSWORD}"

  # --- Hermes Langfuse 插件凭据（与 Gateway 同实例，双写关联用）---
  # 未注入时 Hermes 插件 fail open（hooks 静默 no-op），不影响生产
  hermes-langfuse-public-key: "${HERMES_LANGFUSE_PUBLIC_KEY}"
  hermes-langfuse-secret-key: "${HERMES_LANGFUSE_SECRET_KEY}"
  hermes-langfuse-base-url: "${HERMES_LANGFUSE_BASE_URL}"
