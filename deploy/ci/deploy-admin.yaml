# ============================================================
# UnionAgents 知行 — 管理台前端部署清单
# 使用方式:
#   ${VERSION} / ${REGISTRY} 由 Gitee Go deploy@k8s 的 params 自动替换（REGISTRY 在 Gitee Go 配置为变量）
# ============================================================

---
# ── 管理台前端 ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-admin
  namespace: unionagents
spec:
  replicas: 2
  selector:
    matchLabels: { app: console-admin }
  template:
    metadata:
      labels: { app: console-admin }
      annotations:
        unionagents/rollUpdate: "${GITEE_COMMIT}"
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: admin
        image: "${REGISTRY}/unionagents/console-admin:${VERSION}"
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "200m", memory: "256Mi" }
        livenessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: console-admin
  namespace: unionagents
spec:
  ports:
  - port: 80
    targetPort: 80
  selector: { app: console-admin }
