# UnionAgents 用户门户 — 静态文件服务 + API 反向代理
# 注意: K8s Ingress 已直接路由 /api/controller、/api/gateway、/api 到后端，
#        容器内 nginx 仅作为静态文件服务器。保留 proxy_pass 规则作为故障备用。
server {
    listen 80;
    server_name _;

    # End User Portal (Vue 3 静态文件)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html 绝不缓存：每次发版 chunk hash 变，旧 HTML 引用旧 hash 会 404
        # （"Failed to fetch dynamically imported module"）。hash 寻址的 /assets/ 可长缓存。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # /assets/ 下 chunk 文件名带内容 hash，不可变，可永久缓存
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manager API (认证、终端可见实例 /accessible 等)
    # 含 deploy/events SSE 流式，故 proxy_buffering off + Connection ''。
    location /api/manager/ {
        proxy_pass http://manager:8002/api/manager/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Controller API (部署、状态、SSE)
    # controller 已并入 manager（worker_router 在 /api/controller/* 字面路径提供服务），
    # 故转发到 manager:8002，不再指向已下线的 controller:8001。
    location /api/controller/ {
        proxy_pass http://manager:8002/api/controller/;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 浏览器沙箱 VNC WS（需 upgrade；与 SSE 的 Connection '' 分离。最长前缀匹配优先于 /api/gateway/）
    # token 经 ?token= query 透传（不入 access log，见下方 log_not_found off）
    # 注意：不剥 /api/gateway 前缀——gateway 的 VNC WS 路由按 /api/gateway/v1/browser/{agent}/vnc
    # 注册（带前缀，与 chat-ingress 不剥前缀一致）。剥了会 404。其余 /api/gateway/ 聊天路由
    # 是无前缀注册的，仍由下方 location 剥前缀转发。
    location /api/gateway/v1/browser/ {
        proxy_pass http://gateway:8010;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gateway (聊天请求 — 剥离 /api/gateway 前缀后转发)
    location /api/gateway/ {
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass http://gateway:8010;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hub 能力中心（hub 原生服务 /api/hub/*；Ingress 直连时的故障备用路径）
    # hub 未部署时指向 127.0.0.1:1（blackhole），nginx 启动不依赖 hub DNS 解析。
    location /api/hub/ {
        proxy_pass http://127.0.0.1:1;
    }
}
