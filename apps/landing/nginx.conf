# UnionAgents 产品主页 — 纯静态文件服务（landing + docs 同站）
server {
    listen 80;
    server_name _;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # VitePress 带哈希文件名的静态资源：1 年不可变缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # docs VitePress 资源（JS/CSS/图片，带 hash 文件名）：1 年 immutable
    # 必须在 /docs/ 之前，nginx 最长前缀匹配
    location /docs/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # APK 文件：正确 MIME 类型 + 强制下载
    location ~* \.apk$ {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Android 客户端后端 API 反向代理 ──
    # ECS 安全组只开 30080/30081/30082，manager/gateway 是 ClusterIP 不对外暴露。
    # 通过 landing nginx 转发：手机访问 http://<ecs-ip>:30082/api/manager/* → manager:8002
    # SSE 流式必须 proxy_buffering off + chunked + 长连接超时（默认 60s 不够）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 关键：去掉 Origin/Referer，Hermes 引擎收到会 403
    proxy_set_header Origin "";
    proxy_set_header Referer "";

    location /api/manager/ {
        proxy_pass http://manager.unionagents.svc.cluster.local:8002;
        # APK 上传：base APK ~10MB，admin 后台 + manager API 上传需放宽 nginx 默认 1MB 限制
        client_max_body_size 50m;
        # APK 下载 / SSE：禁缓冲，让 nginx 收到首字节立即转发，TTFB 不被 pod-to-pod 网络拖累
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /api/gateway/ {
        proxy_pass http://gateway.unionagents.svc.cluster.local:8010;
        # SSE 流式：禁缓冲 + 禁 chunk 重组
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── APP 图标反代 ──
    # manager 把 icon 上传到公开桶 unionagents-avatars，URL 形如 /avatars/unionagents-avatars/app-icons/{id}/{uuid}.{ext}
    # landing nginx 反代到 MinIO，让 icon 在下载页直接可访问
    # proxy_pass 带 `/`：nginx strip /avatars/ 前缀，把 /avatars/<bucket>/<key> 变成 /<bucket>/<key> 给 minio
    location /avatars/ {
        proxy_pass http://minio.unionagents.svc.cluster.local:9000/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 资料中心（VitePress 静态站点）：对外公开，无需登录
    # try_files 加 $uri.html：VitePress cleanUrls=true 生成 .html 文件，但 URL 无后缀
    # 不加 $uri.html 时 /docs/guide/getting-started 会 fallback 到 /docs/index.html，
    # 导致左侧栏（由 VitePress router 激活）是 guide 目录，右侧内容却是首页。
    location /docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ /docs/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # HTML 入口：永远不缓存，确保发版后用户立刻拿到新 index.html
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback：根路径访问返回 index.html，/en/ 路径返回 en/index.html
    # $uri.html：VitePress cleanUrls=true 生成 .html 文件但 URL 无后缀（/download → download.html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
