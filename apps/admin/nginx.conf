# UnionAgents 管理台 — 静态文件服务 + API 反向代理
# K8s Ingress 会直接路由 /api/manager、/api/controller 到后端，
# 容器内 nginx 默认仅作为静态文件服务器。
# 此配置为端口转发到容器时提供 API 代理能力。
server {
    listen 80;
    server_name _;

    # gzip_static：优先发送构建时预压缩的 .gz 文件
    gzip_static on;

    # gzip 动态压缩（HTML 入口、API 代理响应等未预压缩内容）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff;

    # 不可变静态资源：浏览器缓存 1 年
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # VitePress 资源（JS/CSS/图片，带 hash 文件名）：1 年 immutable
    # 必须在 /docs/ 之前，nginx 最长前缀匹配
    location /docs/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # 资料中心（VitePress 静态站点）：对外公开，无需登录
    location /docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /docs/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # MinIO 公开 bucket 反代（头像等）：后端存相对路径 /avatars/<bucket>/<key>，
    # nginx 去掉 /avatars/ 前缀转发给 minio。避免对外暴露 nip.io host（公网不可达 +
    # 暴露内部域名）。
    # 用变量延迟解析：云端无 MinIO 服务时不阻塞 nginx 启动。注意 proxy_pass 带变量时
    # nginx 忽略指令里的 URI 部分、把原始请求 URI 原样转发（MinIO 会把 avatars 当 bucket
    # 匿名访问 → 403），必须 rewrite...break 显式剥前缀。
    location /avatars/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=30s;
        set $minio_upstream "http://minio.unionagents.svc.cluster.local:9000";
        rewrite ^/avatars/(.*)$ /$1 break;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Manager Swagger UI + OpenAPI spec 代理（对外公开，spec 非敏感）
    # 供 VitePress api-reference 页 iframe 嵌入，自动同步 spec 不手抄。
    # manager FastAPI 默认 docs 在 /docs（非 /api/manager/docs），nginx 路径重写：
    location /api/manager/docs {
        proxy_pass http://manager:8002/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/manager/openapi.json {
        proxy_pass http://manager:8002/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # HTML 入口：永远不缓存（精确匹配 /index.html）
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 管理台 SPA 静态文件 + 根路径 fallback。
    # 必须给 / 也加 no-store：用户访问 http://host/ 时 nginx 走这个 location，
    # 若缺 Cache-Control 浏览器启发式缓存 index.html，重新部署后旧 index.html
    # 引用旧 hash 的 JS chunk，旧 chunk 在 disk cache 命中（immutable 1y）→
    # 旧 SPA 启动 + 新后端 API 不兼容 → JS 抛错 → router.isReady() 卡住 →
    # app.mount 永不执行 → 页面停在 loading 转圈（白屏）。
    # /static/ 和 /api/ 在更精确的 location 中，add_header 不受影响。
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 注意：proxy_pass 用字面 hostname（非 $variable）。变量式 proxy_pass 需配 `resolver`
    # 指令做运行时 DNS 解析，本容器未配 resolver 会导致 502。字面形式由 nginx 启动时经
    # 系统 resolver（/etc/resolv.conf → kube-dns）解析，ClusterIP 稳定，无需 resolver。

    # Manager API (认证、用户、角色、智能体管理)
    # 含 deploy/events SSE 流式（/api/manager/agent-instances/{id}/deploy/events），
    # 故 proxy_buffering off + Connection ''（CLAUDE.md：SSE 必须关缓冲，Connection upgrade 会干扰）。
    # client_max_body_size：APK 上传走 /api/manager/app-releases（base APK ~8MB），
    # 默认 1MB 会 413，提到 50MB 覆盖 APK + icon 提取。
    location /api/manager/ {
        proxy_pass http://manager:8002/api/manager/;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Gateway API（终端 Android 客户端 publish 时可能填 admin 端口 30080，需同样反代 /api/gateway/）
    # landing nginx 也有同样配置；admin 加这条让 30080 端口的 gateway 请求可达。
    # gateway proxy_handler 自己 strip /api/gateway/ 前缀，所以 nginx 只需原样转发。
    location /api/gateway/ {
        proxy_pass http://gateway.unionagents.svc.cluster.local:8010;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Controller API (实例部署、状态、SSE)
    # controller 已并入 manager（worker_router 在 /api/controller/* 字面路径提供服务），
    # 故转发到 manager:8002，不再指向已下线的 controller:8001。
    location /api/controller/ {
        proxy_pass http://manager:8002/api/controller/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hub 能力中心：经 manager hub_proxy 转发（manager 注入 X-Roles 等身份头给 hub）。
    # 不直连 hub：ingress 层无鉴权，直连无人注入身份头 → hub RBAC 全 403。
    location /api/hub/ {
        proxy_pass http://manager:8002/api/hub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Skill Engine（技能工作室）：经 manager skill_engine_proxy 转发到 skill-engine:8004。
    # 含 sessions/{role}/events SSE 流式，故 proxy_buffering off + Connection ''。
    location /api/skill-engine/ {
        proxy_pass http://manager:8002/api/skill-engine/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OpenAI 兼容 API（/v1/* → gateway:8010）
    # 外部 OpenAI SDK 用 Authorization: Bearer sk-... 直连 admin 门户 30080/v1/*，
    # admin nginx 反代到 gateway ClusterIP。鉴权由 gateway 自行完成（sk- 走 API Key 路径）。
    # SSE 流式：proxy_buffering off + Connection ''（CLAUDE.md：SSE 必须关缓冲，Connection upgrade 会干扰）。
    location /v1/ {
        proxy_pass http://gateway:8010;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
