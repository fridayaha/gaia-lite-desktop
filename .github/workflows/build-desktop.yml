name: Build Desktop (Windows)

# 在 Windows runner 上打 Gaia Lite 桌面版（PyInstaller sidecar + Tauri .exe/.msi）。
# 手动触发或打 tag 时跑。产物上传为 artifact + Release 资产。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            engines/gaia/tauri/src-tauri/target
            ~/.cargo
          key: cargo-windows-${{ hashFiles('engines/gaia/tauri/src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI (npm global — provides `tauri` command)
        run: npm install -g @tauri-apps/cli

      - name: Verify tauri CLI on PATH
        shell: bash
        run: |
          tauri --version
          which tauri || where tauri

      - name: Sync Python deps (lite + dev)
        working-directory: engines/gaia
        run: |
          uv sync --extra lite --extra dev
          uv pip install pyinstaller

      - name: Build PyInstaller sidecar
        working-directory: engines/gaia
        run: |
          .venv\Scripts\pyinstaller gaia-lite.spec --noconfirm --log-level WARN

      - name: Stage sidecar for Tauri
        working-directory: engines/gaia
        shell: bash
        run: |
          rm -rf tauri/sidecar
          mkdir -p tauri/sidecar
          cp -R dist/gaia-lite-backend tauri/sidecar/gaia-lite-backend
          ls tauri/sidecar/gaia-lite-backend/gaia-lite-backend.exe && echo "sidecar staged ✅"

      - name: Generate Windows icons (incl .ico)
        working-directory: engines/gaia
        shell: bash
        run: |
          tauri icon ../../apps/enduser/public/favicon-512.png -o tauri/src-tauri/icons
          ls tauri/src-tauri/icons/icon.ico && echo "icon.ico generated ✅"

      - name: Build Tauri (Windows)
        working-directory: engines/gaia/tauri/src-tauri
        shell: bash
        run: tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gaia-windows-x64
          path: |
            engines/gaia/tauri/src-tauri/target/release/bundle/nsis/*.exe
            engines/gaia/tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            engines/gaia/tauri/src-tauri/target/release/bundle/nsis/*.exe
            engines/gaia/tauri/src-tauri/target/release/bundle/msi/*.msi
