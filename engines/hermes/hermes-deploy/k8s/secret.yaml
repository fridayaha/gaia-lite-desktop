apiVersion: v1
kind: Secret
metadata:
  name: hermes-api-keys
  namespace: hermes
type: Opaque
stringData:
  # API Server 认证密钥（必须设置，否则 API Server 拒绝启动）
  # 生成方式: openssl rand -hex 16
  API_SERVER_KEY: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_16"
  # LLM 提供商 API Key（至少填写一个）
  DASHSCOPE_API_KEY: "your-dashscope-api-key-here"
  DASHSCOPE_BASE_URL: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  OPENROUTER_API_KEY: ""
  HERMES_CUSTOM_API_KEY: ""
