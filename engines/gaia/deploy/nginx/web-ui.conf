# Gaia web-ui nginx 配置
# 静态托管 dist + SPA history fallback + API 反代到 gaia-api（k8s Service 名）
# 对应 docker-compose vite proxy 规则（vite.config.ts）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 gaia-api（容器内通过 k8s Service DNS 解析）
    location /ontologies {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /authz {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # /auth（gaia-api 会话/部署信息，区别于下方 /api/auth 指向 better-auth）
    location /auth {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 权限治理：用户/用户组/角色/组织/空间/项目
    location /identity {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /containers {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 安全标记：marking router 无前缀，路由直接挂在根上
    location /markings {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /marking-categories {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /resources {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /objects {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # /actions 既是 API 前缀又是页面路由：API 请求代理，页面导航走 SPA
    location /actions {
        # 浏览器页面导航(Accept: text/html)走 SPA index.html
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ai {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 流式：禁用缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /api/auth {
        proxy_pass http://gaia-better-auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api {
        proxy_pass http://gaia-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /health {
        proxy_pass http://gaia-api:8000;
    }
    location /metrics {
        proxy_pass http://gaia-api:8000;
    }
}
