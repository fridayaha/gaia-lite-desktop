# Trino catalog 配置（ConfigMap）
# 相比 docker-compose 的优化：连接地址从容器名改为 k8s Service 名
#   gravitino:8090 → gaia-gravitino:8090
#   gravitino:9001 → gaia-gravitino:9001
#   postgres:5432  → gaia-postgres:5432
#   rustfs:9000    → gaia-rustfs:9000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gaia-trino-catalog
  namespace: gaia
data:
  gravitino.properties: |
    connector.name=gravitino
    gravitino.metalake=ontology
    gravitino.uri=http://gaia-gravitino:8090
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://gaia-gravitino:9001/iceberg
    iceberg.rest-catalog.vended-credentials-enabled=false
    iceberg.rest-catalog.nested-namespace-enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=http://gaia-rustfs:9000
    s3.aws-access-key=minioadmin
    s3.aws-secret-key=minioadmin
    s3.region=us-east-1
    s3.path-style-access=true
  pgnative.properties: |
    # TEMPORARY WORKAROUND: 绕过 Gravitino jsonb→ExternalType 限制（见 docs/bugfix/gravitino-1.3.0-upgrade.md）
    connector.name=postgresql
    connection-url=jdbc:postgresql://gaia-postgres:5432/ontology
    connection-user=ontology
    connection-password=ontology
    unsupported-type-handling=CONVERT_TO_VARCHAR
