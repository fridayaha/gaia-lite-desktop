# Gaia 引擎敏感配置（CI 部署用，由 deploy.sh + envsubst 注入实际值）
# 占位符 ${VAR} 由 deploy/ci/.env.local 提供
apiVersion: v1
kind: Secret
metadata:
  name: gaia-secret
  namespace: gaia
type: Opaque
stringData:
  # ── PostgreSQL ──
  pg-user: "${GAIA_PG_USER}"
  pg-password: "${GAIA_PG_PASSWORD}"
  pg-database: "${GAIA_PG_DATABASE}"
  database-url: "postgresql+asyncpg://${GAIA_PG_USER}:${GAIA_PG_PASSWORD}@gaia-postgres:5432/${GAIA_PG_DATABASE}"
  database-url-sync: "postgresql+psycopg://${GAIA_PG_USER}:${GAIA_PG_PASSWORD}@gaia-postgres:5432/${GAIA_PG_DATABASE}"

  # ── 对象存储 RustFS ──
  s3-access-key-id: "${GAIA_S3_ACCESS_KEY}"
  s3-secret-access-key: "${GAIA_S3_SECRET_KEY}"

  # ── Doris ──
  doris-user: "${GAIA_DORIS_USER}"
  doris-password: "${GAIA_DORIS_PASSWORD}"

  # ── Neo4j ──
  neo4j-password: "${GAIA_NEO4J_PASSWORD}"

  # ── Better Auth ──
  better-auth-secret: "${GAIA_BETTER_AUTH_SECRET}"
  gaia-provision-token: "${GAIA_PROVISION_TOKEN}"
  # Better Auth 信任的 Origin（CORS），逗号分隔。生产环境必须包含用户访问地址
  # 默认含 dev 地址 + NodePort 公网地址（由 .env.local 的 GAIA_TRUSTED_ORIGINS 提供）
  trusted-origins: "${GAIA_TRUSTED_ORIGINS}"

  # ── AI Provider Keys ──
  openai-api-key: "${GAIA_OPENAI_API_KEY}"
  # 自定义 OpenAI 兼容端点 base URL（GLM/Pangu/ZhipuAI/vLLM/LiteLLM 网关等）。
  # 空字符串=用 OpenAI 默认 https://api.openai.com/v1。仅当 AI_MODEL 用
  # openai:/openai-chat: 前缀时生效；内置 provider（deepseek/...）忽略此项。
  openai-base-url: "${GAIA_OPENAI_BASE_URL}"
  deepseek-api-key: "${GAIA_DEEPSEEK_API_KEY}"
  anthropic-api-key: "${GAIA_ANTHROPIC_API_KEY}"
  google-api-key: "${GAIA_GOOGLE_API_KEY}"
  moonshot-api-key: "${GAIA_MOONSHOT_API_KEY}"
  alibaba-api-key: "${GAIA_ALIBABA_API_KEY}"
