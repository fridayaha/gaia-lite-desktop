# SeaTunnel Zeta engine configuration (aligned with 2.3.13 defaults).
# Reference: apache/seatunnel:2.3.13 /opt/seatunnel/config/seatunnel.yaml
#
# Notes on upgrade from 2.3.11:
# - Removed the non-standard `zeta.master-server` / `zeta.worker-server` block;
#   those keys are not recognized by 2.3.x and had no effect. Zeta server ports
#   are controlled by hazelcast-*-master/worker.yaml.
# - Renamed `print-execution-interval` -> `print-execution-info-interval` and
#   `print-job-metric-interval` -> `print-job-metrics-info-interval` to match
#   the 2.3.13 schema.
# - Added the `checkpoint.storage.plugin-config` block: 2.3.13 requires an
#   explicit plugin config for hdfs checkpoint storage.
seatunnel:
  engine:
    classloader-cache-mode: true
    history-job-expire-minutes: 1440
    backup-count: 1
    queue-type: blockingqueue
    print-execution-info-interval: 60
    print-job-metrics-info-interval: 60
    slot-service:
      dynamic-slot: true
    checkpoint:
      interval: 60000
      timeout: 60000
      storage:
        type: hdfs
        max-retained: 3
        plugin-config:
          namespace: /tmp/seatunnel/checkpoint_snapshot
          storage.type: hdfs
          fs.defaultFS: file:///tmp/ # Ensure that the directory has write permission
    telemetry:
      metric:
        enabled: false
      logs:
        scheduled-deletion-enable: true
    http:
      enable-http: true
      port: 8080
      enable-dynamic-port: false
