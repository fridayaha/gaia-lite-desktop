#
# Gravitino Iceberg REST Server — 独立 REST Catalog，对接 RustFS
# 下游 SeaTunnel / PyIceberg / Trino 全部通过此端点访问 Iceberg 表
#

# 基础服务端口
gravitino.iceberg-rest.host = 0.0.0.0
gravitino.iceberg-rest.httpPort = 9001
gravitino.iceberg-rest.minThreads = 24
gravitino.iceberg-rest.maxThreads = 200
gravitino.iceberg-rest.stopTimeout = 30000
gravitino.iceberg-rest.idleTimeout = 30000
gravitino.iceberg-rest.threadPoolWorkQueueSize = 100
gravitino.iceberg-rest.requestHeaderSize = 131072
gravitino.iceberg-rest.responseHeaderSize = 131072
gravitino.iceberg-rest.shutdown.timeout = 3000

# 元数据后端：PostgreSQL（持久化 Iceberg 表元数据）
gravitino.iceberg-rest.catalog-backend = jdbc
gravitino.iceberg-rest.catalog-backend-name = ontology
gravitino.iceberg-rest.jdbc-driver = org.postgresql.Driver
gravitino.iceberg-rest.uri = jdbc:postgresql://postgres:5432/ontology
gravitino.iceberg-rest.jdbc-user = ontology
gravitino.iceberg-rest.jdbc-password = ontology
gravitino.iceberg-rest.jdbc-initialize = true

# 存储：RustFS via S3FileIO（原生 SigV4，无 Hadoop S3A）
gravitino.iceberg-rest.warehouse = s3://ontology-warehouse
gravitino.iceberg-rest.io-impl = org.apache.iceberg.aws.s3.S3FileIO
gravitino.iceberg-rest.s3-endpoint = http://rustfs:9000
gravitino.iceberg-rest.s3-access-key-id = minioadmin
gravitino.iceberg-rest.s3-secret-access-key = minioadmin
gravitino.iceberg-rest.s3-region = us-east-1
gravitino.iceberg-rest.s3-path-style-access = true
gravitino.iceberg-rest.client-region = us-east-1

# S3 Token 分发：下游客户端免密钥
# 注：RustFS 用静态 access key/secret，无需 S3 token（IAM role）机制。
# 开启 s3-token 会因缺少 s3-role-arn 导致所有 REST 请求 500。
# gravitino.iceberg-rest.credential-providers = s3-token
