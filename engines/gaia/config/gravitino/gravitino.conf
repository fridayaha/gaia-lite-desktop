# Gravitino Server Configuration
# ⚠️ 本文件未被 docker-compose 挂载到容器，仅作历史参考。
#    实际生效配置见：
#    - Gravitino 主服务：env（docker-compose.yml gravitino 服务段）
#    - Iceberg REST Catalog：config/gravitino/gravitino-iceberg-rest-server.conf + env（aux service 模式）
#    详见 docs/bugfix/gravitino-1.3.0-upgrade.md
gravitino.server.webserver.httpPort = 8090

# ⚠️ Iceberg REST Catalog 由 Gravitino 容器内置提供（端口 9001，端点前缀 /iceberg），
#    不是独立服务，没有 iceberg-rest:8181。下方旧配置已废弃，勿用。
# gravitino.iceberg.rest.catalog.uri = http://iceberg-rest:8181  # 已废弃
# gravitino.iceberg.rest.catalog.warehouse = s3://ontology-warehouse/  # 已废弃

# Catalog configurations
gravitino.catalog.backend = jdbc
gravitino.catalog.jdbc.url = jdbc:postgresql://postgres:5432/ontology
gravitino.catalog.jdbc.user = ontology
gravitino.catalog.jdbc.password = ontology
