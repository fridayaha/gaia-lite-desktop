# ⚠️ TEMPORARY WORKAROUND — see docs/bugfix/gravitino-1.3.0-upgrade.md
#
# This is a native Trino PostgreSQL connector that bypasses Gravitino's type
# conversion layer. It exists because Gravitino 1.2.0's PostgreSqlTypeConverter
# maps `jsonb` to ExternalType("jsonb"), and the Gravitino Trino connector
# rejects ExternalType at metadata resolution time
# (`Unsupported gravitino datatype: external(jsonb)`), so the
# trino.bypass.* properties on the Gravitino-managed `pg` catalog never take
# effect.
#
# The native connector has built-in JSONB -> JSON mapping and handles all 17
# jsonb columns in the business ontology schema correctly.
#
# TODO(remove after Gravitino 1.3.0 upgrade): once Gravitino 1.3.0 is deployed
# with type-converter.custom.mapping enabled, jsonb will be mapped to a standard
# Gravitino type and the Gravitino-managed `pg` catalog will handle it natively.
# At that point delete this file, its docker-compose volume mount, and route all
# PG queries back through the `pg` (Gravitino) catalog.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/ontology
connection-user=ontology
connection-password=ontology
# Fallback for any other unsupported PG types: expose them as VARCHAR instead
# of hiding the column.
unsupported-type-handling=CONVERT_TO_VARCHAR
