connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://gravitino:9001/iceberg
# warehouse is intentionally NOT set. Gravitino 1.2.0's Iceberg REST
# service treats the `warehouse` query param as a catalog-name lookup
# key (Issue #10486); any non-empty value that isn't a registered
# catalog name returns NoSuchCatalogException. Trino's iceberg REST
# client omits the param when warehouse is unset, and Gravitino then
# returns its default catalog config — which is what we want.
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.rest-catalog.nested-namespace-enabled=true

# Native S3 file system (Trino >= 426) — talks to RustFS (S3-compatible).
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
s3.region=us-east-1
s3.path-style-access=true
