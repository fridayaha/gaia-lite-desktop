# Gaia PostgreSQL config — shared by business-ontology metadata and
# Gravitino entity store. Enables logical replication so SeaTunnel's
# PostgreSQL-CDC source can stream action_execution_logs (Action loop S6)
# and object_state (real-time index path S8) via WAL logical decoding.
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10
# Graph-reasoning 特性 (§5.5): TimescaleDB 需预加载才能启用超表功能。
# 一体镜像 ngosang/timescaledb-postgis 预装 timescaledb 库，此处预加载。
shared_preload_libraries = 'timescaledb'
# Keep default listen/ports; compose sets POSTGRES_USER/DB via env.
listen_addresses = '*'
