# Doris BE Configuration
be_port = 9060
heartbeat_service_port = 9050
webserver_port = 8040
log_dir = /opt/apache-doris/be/log
storage_root_path = /opt/apache-doris/be/storage
priority_networks = 172.18.0.0/24
priority_networks = 172.18.0.0/24
# Memory limit as % of container memory (enables Doris to size memtable
# loads against the container cgroup, not the host). Required for the
# TextQL semantic-recall ANN table (ADR-012 Step 2): HNSW/IVF index builds
# pre-allocate ~2GB for memtable load, which exceeds the default 1GB
# container. Pair with the raised docker-compose mem_limit.
mem_limit = 80%
# Allow large memtable loads (vector upserts) without hitting the load
# memory cap before the cgroup limit.
load_mem_limit = 80%
priority_networks = 172.18.0.0/24
priority_networks = 172.18.0.0/24
priority_networks = 172.18.0.0/24
