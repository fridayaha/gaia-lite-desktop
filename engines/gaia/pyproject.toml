[project]
name = "ontology"
version = "0.1.0"
description = "Palantir-style Ontology API with layered open-source architecture"
requires-python = ">=3.12"
# 核心依赖：full / lite 两版都装（EDITION 无关）。
# edition 专属重依赖见 [project.optional-dependencies] 的 full / lite extras，
# 由 `uv sync --extra ${EDITION}` 选择性安装（Dockerfile ARG EDITION）。
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "alembic>=1.13.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "jinja2>=3.1.0,<4.0",
    "prometheus-client>=0.20.0,<1.0",
    "structlog>=24.0.0,<25.0",
    "simpleeval>=1.0.5,<2.0",
    "griffelib>=2.0",
    "pydantic-ai-slim[ag-ui]==2.0.0",
    "fastmcp>=3.4.0",
    "openai>=2.41.1",
    "pyyaml>=6.0,<7.0",
    "sqlglot>=30.0,<31.0",
    "cedarpy>=4.8,<5.0",
    "cashews>=7.5,<8.0",
    "authlib>=1.3,<2.0",
    "fastapi-betterauth>=0.2.6",
]

[project.scripts]
# Standalone MCP server process — exposes ontology tools to external Agents
# (Cursor / Claude Desktop / custom) over stdio or Streamable HTTP.
# See docs/architecture/ontology-tool-layer.md §三 and ADR-009 decision 7.
ontology-mcp = "ontology.protocols.mcp_server:main"

[project.optional-dependencies]
# 云版 full：全量数据栈重依赖（PostgresMetaStore asyncpg / Iceberg / Trino / Neo4j / S3 / embedding）。
# `uv sync --extra full` 复刻 A2 前的核心依赖集，云版行为不变。
full = [
    "asyncpg>=0.29.0,<1.0",  # PostgresMetaStore async PG driver
    "psycopg[binary]>=3.2.0,<4.0",  # alembic sync 迁移 + PG 数据源
    "aiomysql>=0.2.0,<1.0",
    "pyiceberg>=0.7.0,<1.0",
    "trino>=0.330.0,<1.0",
    "aiobotocore>=3.7,<4.0",  # async S3 client — ensure warehouse bucket exists on startup
    # ── Graph-reasoning 特性 (graph-reasoning-design.md) ──
    # Neo4j async driver — Graph Layer。driver 创建一次，lifespan 关闭。
    "neo4j>=5.26,<6.0",
    "onnxruntime>=1.20,<2.0",  # embedding 推理
    "tokenizers>=0.20,<1.0",
]
# 桌面版 lite：SQLite 元数据 + DuckDB 联邦 + 数据源插件驱动。
# 不含 neo4j/pyiceberg/trino/onnxruntime/asyncpg/aiobotocore 等云版重依赖。
lite = [
    "aiosqlite>=0.22.1",  # SQLite async driver — 元数据层
    "duckdb>=1.0",  # 嵌入式联邦引擎
    "psycopg[binary]>=3.2.0,<4.0",  # PG 数据源插件
    "mysql-connector-python>=8.0",  # MySQL 数据源插件
]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "mypy>=1.11.0,<2.0",
    "ruff>=0.6.0,<1.0",
    "testcontainers>=4.8.0,<5.0",
    "locust>=2.31.0,<3.0",
    "faker>=30.0,<40.0",  # marketing benchmark 中文数据生成
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontology"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# TextQL feasibility verification scripts embed long SQL test fixtures.
"scripts/verify_sqlglot_feasibility*.py" = ["E501"]
"scripts/verify_ir_feasibility.py" = ["E501"]
# ObjectSet parser prompt embeds long JSON template lines.
"src/ontology/services/textql/object_set_parser.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
namespace_packages = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/ontology --cov-report=term-missing"
markers = [
    "unit: 单元测试，Mock 底层客户端",
    "integration: 接口集成测试，真实 Layer + Mock 底层",
    "system: 系统测试，全栈 docker-compose",
    "performance: 性能测试，专用环境",
    "slow: 慢速测试",
]
