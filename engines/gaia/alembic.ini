# Alembic 配置 — Gaia 业务表 schema 迁移（public schema）
#
# 单一真相源：ORM 模型（src/ontology/core/models/）→ alembic revision --autogenerate → migration 链
# Gravitino 的 gravitino_store schema 不归 Alembic 管（由 infra/gravitino-pg-schema.sql 初始化）
#
# 常用命令（用 .venv/bin/alembic 直调，不用 uv run）：
#   .venv/bin/alembic revision --autogenerate -m "描述"   # 生成迁移
#   .venv/bin/alembic upgrade head                         # 应用到最新
#   .venv/bin/alembic current                              # 查看当前版本
#   .venv/bin/alembic history                              # 查看迁移历史
#   .venv/bin/alembic check                                # 检测 ORM 与 DB 是否漂移

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板前缀（让生成的 migration import 路径正确）
prepend_sys_path = .

# 版本文件命名：日期_序号_描述
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区
timezone = UTC

# sqlalchemy.url 留空，由 env.py 从 settings.pg_sync_dsn 动态读取
# （避免把凭据写进 ini 文件）
sqlalchemy.url =

[post_write_hooks]
# 生成 migration 后自动用 ruff 格式化
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
