version: '1.0'
name: deploy-hub
displayName: 部署_Hub_服务
triggers:
  trigger: manual
variables:
  VERSION: "0.6.2"
stages:
  - name: deploy
    displayName: 部署_Hub
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: deploy@k8s
        name: deploy_hub
        displayName: K8S部署_Hub
        version: v1.31.0
        certificate: ${GITCODE_K8S_CERT_ID}
        namespace: unionagents
        yaml: ./deploy/ci/deploy-hub.yaml
        isReplace: false
        skiptls: false
        params:
          VERSION: 0.6.2
          REGISTRY: ${REGISTRY}
        notify: []
        strategy:
          retry: '0'
