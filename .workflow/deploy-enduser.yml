version: '1.0'
name: deploy-enduser
displayName: 部署用户门户前端
triggers:
  trigger: manual
variables:
  VERSION: "0.5.3"
stages:
  - name: deploy
    displayName: 部署用户门户
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: deploy@k8s
        name: deploy_enduser
        displayName: K8S部署用户门户
        version: v1.31.0
        certificate: "${GITCODE_K8S_CERT_ID}"
        namespace: unionagents
        yaml: ./deploy/ci/deploy-enduser.yaml
        isReplace: false
        skiptls: false
        params:
          VERSION: 0.5.3
          REGISTRY: ${REGISTRY}
        notify: []
        strategy:
          retry: '0'
